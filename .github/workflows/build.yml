name: Build

on:
  workflow_call:
    inputs:
      tags:
        type: string
        description: The Docker Tags (see docker/metadata-action@v4 for available values)
        required: true

jobs:
  build-push-php:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3.5.2

    - name: Build/Push
      uses: coopTilleuls/action-docker-build-push@v10
      with:
        IMAGE_NAME: pays-de-blain-vis-mon-metier
        BUILD_CONTEXT: .
        BUILD_TARGET: frankenphp_prod
        REGISTRY_JSON_KEY: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_REPOSITORY: ghcr.io/cooptilleuls
        SKIP_CHECKOUT: "true"
        # Deactivate Trivy
        SECURITY_SCAN: "false"
    # - name: Build/Push
    #   uses: coopTilleuls/action-docker-build-push@v10
    #   with:
    #     IMAGE_NAME: postgres17-awscli
    #     BUILD_CONTEXT: SRE
    #     REGISTRY_JSON_KEY: ${{ secrets.GITHUB_TOKEN }}
    #     IMAGE_REPOSITORY: ghcr.io/cooptilleuls
    #     SKIP_CHECKOUT: "true"
    #     # Deactivate Trivy
    #     SECURITY_SCAN: "false"
  # Push miroir vers le registry Scaleway, en plus du push ghcr.io ci-dessus, le temps des tests de
  # bascule vers le cluster Scaleway. Le flavor prefix (prod-/nonprod-) est indispensable : l'ArgoCD
  # Image Updater de l'Application permanente (opentofu-scaleway-infra-mut/2_environments/
  # 3_k8s_objects/argocd_sites.tf, allowTags = "regexp:^${terraform.workspace}-") ne suit que les
  # tags "prod-sha-xxxxxxx"/"nonprod-sha-xxxxxxx". Le futur ApplicationSet PR (argocd_pr_sites.tf,
  # pas encore activé pour ce site) attend lui un tag exact "sha-xxxxxxx" sans prefix -- à adapter
  # le jour de son activation.
  build-push-php-scaleway:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        registry: rg.fr-par.scw.cloud
        username: ${{ secrets.SCW_USERNAME }}
        password: ${{ secrets.SCW_SECRET_KEY }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: rg.fr-par.scw.cloud/infra-mut-cr-scw/vis-mon-metier
        tags: ${{ inputs.tags }}
        flavor: |
          prefix=${{ github.ref_name == 'main' && 'prod-' || 'nonprod-' }},onlatest=true

    - name: Build/Push
      uses: docker/build-push-action@v6
      with:
        context: .
        target: frankenphp_prod
        tags: ${{ steps.meta.outputs.tags }}
        push: true
        cache-from: |
          type=gha,scope=${{ github.ref }}
          type=gha,scope=refs/heads/main
        cache-to: |
          type=gha,scope=${{ github.ref }},mode=max

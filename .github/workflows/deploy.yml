name: Deploy

on:
  workflow_call:
    inputs:
      brand:
        type: string
        required: true
        default: pays-de-blain
      prod_domain:
        type: string
        required: true
      nonprod_domain:
        type: string
        required: true
    secrets:
      workload-identity-provider:
        description: GCP workload identity provider
        required: true
      project_id:
        description: secret
      pgpassword:
        description: database password


jobs:
  meta:
    name: Meta
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.meta.outputs.release_name }}
      environment: ${{ steps.meta.outputs.environment }}
      namespace: ${{ steps.meta.outputs.namespace }}
      server_name: ${{ steps.meta.outputs.server_name }}
      mailer_dns: ${{ steps.meta.outputs.mailer_dns }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      context: ${{ steps.meta.outputs.context }}
      app_env: ${{ steps.meta.outputs.app_env }}

    steps:
      - name: Generate metadata
        id: meta
        run: |
          set -xo pipefail
          IS_PR=false
          APP_ENV=prod
          BRAND_SUFFIX=""
          if [[ "${{ inputs.brand }}" != "pays-de-blain" ]]; then
            BRAND_SUFFIX="-${{ inputs.brand }}"
          fi

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            # Tags are deployed in prod
            ENVIRONMENT=prod
            IMAGE_TAG=sha-${GITHUB_SHA::7}
            NAMESPACE=prod-${{ vars.PROJECT }}
            RELEASE_NAME=prod${BRAND_SUFFIX}
            SERVER_NAME=${{ inputs.prod_domain }}
          else
            APP_DEBUG=true
            ENVIRONMENT=nonprod
            IMAGE_TAG=sha-${GITHUB_SHA::7}
            NAMESPACE=nonprod-${{ vars.PROJECT }}
            RELEASE_NAME=staging${BRAND_SUFFIX}
            SERVER_NAME=${RELEASE_NAME}.${{ inputs.nonprod_domain }}
          fi

          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "context=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          echo "mailer_dns=${MAILER_DSN}" >> $GITHUB_OUTPUT
          echo "server_name=${SERVER_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "app_env=${APP_ENV}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    environment:
      name: ${{ needs.meta.outputs.environment }}
    needs: ["meta"]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: GKE Auth
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: '${{ secrets.project_id }}'
          workload_identity_provider: '${{ secrets.workload-identity-provider }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.project_id }}

      - name: setup database_url according to the brant
        run: |
          # we will have several brands in the future, so we use case to set the database url according to the brand
          # the secrets and vars are set in the environment variables of the repository
          case "${{ inputs.brand }}" in
            "pays-de-blain")
              echo "DATABASE_URL=postgresql://${{ vars.PGUSER }}:${{ secrets.PGPASSWORD }}@${{ vars.PGHOST }}:5432/${{ vars.PGDATABASE }}?serverVersion=14&charset=utf8" >> $GITHUB_ENV
              ;;
            "cceg")
              echo "DATABASE_URL=postgresql://${{ vars.PGUSER_CCEG }}:${{ secrets.PGPASSWORD_CCEG }}@${{ vars.PGHOST }}:5432/${{ vars.PGDATABASE_CCEG }}?serverVersion=14&charset=utf8" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown brand: ${{ inputs.brand }}"
              exit 1
              ;;
          esac

      - name: Connect cluster
        run: |
          gcloud components install gke-gcloud-auth-plugin
          gcloud auth login --cred-file=$CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
          gcloud container clusters get-credentials ${{ vars.CLUSTER_NAME }} --region europe-west1 --project ${{ secrets.project_id }}
          kubectl config view

      # https://github.com/helm/helm/issues/8036
      - name: Build helm dependencies
        run: |
          set -o pipefail
          # add all repos
          if [ -f "./helm/chart/Chart.lock" ]; then
            yq --indent 0 '.dependencies | map(["helm", "repo", "add", .name, .repository] | join(" ")) | .[]' "./helm/chart/Chart.lock"  | sh --;
          fi
          helm dependency build ./helm/chart

      - name: Deploy on namespace
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          if ! helm upgrade --install ${{ needs.meta.outputs.release_name }} ./helm/chart \
            --atomic \
            --debug \
            --timeout 600s \
            --namespace ${{ needs.meta.outputs.namespace }} \
            --set=php.image.tag=${{ needs.meta.outputs.image_tag }} \
            --set=php.appEnv=${{ needs.meta.outputs.app_env}} \
            --set=php.appBrand=${{ inputs.brand }} \
            --set=mailer.dsn_name=${{ vars.MAILER_DSN_NAME }} \
            --set=mailer.dsn_port=${{ vars.MAILER_DSN_PORT }} \
            --set=database_url="${{ env.DATABASE_URL }}" \
            --set=project=${{ vars.PROJECT }} \
            --set=ingress.server_name=${{ needs.meta.outputs.server_name }} \
            --set=ingress.hosts[0].host=${{ needs.meta.outputs.server_name }} \
            --set=ingress.tls[0].hosts[0]=${{ needs.meta.outputs.server_name }} \
            --values ./helm/chart/values.yaml \
            --values ./helm/chart/values-${{ needs.meta.outputs.context }}.yaml \
            | sed --unbuffered '/USER-SUPPLIED VALUES/,$d' ; then
                echo "Deployment has failed!"
                echo "Here are the last events to help diagnose the problem:"
                kubectl get events --sort-by  --namespace ${{ needs.meta.outputs.namespace }} .metadata.creationTimestamp
                exit 1
          fi

      - name: Output deployment URL
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        env:
          URL: ${{ needs.meta.outputs.server_name }}
        with:
          script: |
            const { URL } = process.env
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Chart has been deployed with this url:\n\`\`\`\n${URL}\n\`\`\``
            })

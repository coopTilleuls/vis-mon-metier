name: CD
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      tags: |
        type=ref,event=pr
        type=ref,event=tag
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=sha-{{sha}}

  # The nonprod GKE nodes (targeted by develop deploys) are stopped outside
  # business hours by nodes_pools_scheduler.tf (start 8h / stop 18h, Mon-Fri,
  # Europe/Paris). Deploys triggered from develop are skipped outside that
  # window; a 17h cutoff leaves margin for the helm upgrade to finish before
  # nodes stop at 18h.
  # The nonprod GKE nodes (targeted by develop deploys) are stopped outside
  # business hours by nodes_pools_scheduler.tf (start 8h / stop 18h, Mon-Fri,
  # Europe/Paris). Deploys triggered from develop are skipped outside that
  # window; a 17h cutoff leaves margin for the helm upgrade to finish before
  # nodes stop at 18h.
  check-business-hours:
    name: Check business hours
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check current time is within business hours
        id: check
        run: |
          day=$(TZ=Europe/Paris date +%u)
          hour=$(TZ=Europe/Paris date +%-H)
          allowed=false
          if [ "$day" -le 5 ] && [ "$hour" -ge 8 ] && [ "$hour" -lt 17 ]; then
            allowed=true
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  deploy-pays-de-blain:
    name: Deploy Pays de Blain
    needs: [build, check-business-hours]
    if: |
      always() && needs.build.result == 'success' &&
      (github.ref_name != 'develop' || needs.check-business-hours.outputs.allowed == 'true')
    uses: ./.github/workflows/deploy.yml
    concurrency: ${{ github.ref }}-deploy-pays-de-blain
    with:
      brand: pays-de-blain
      prod_domain: ${{ vars.PROD_DOMAIN }}
      nonprod_domain: ${{ vars.NONPROD_DOMAIN }}
    secrets:
      workload-identity-provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
      project_id: ${{ secrets.PROJECT_ID }}
      pgpassword: ${{ secrets.PGPASSWORD }}

  deploy-cceg:
    name: Deploy CCEG
    needs: [build, check-business-hours]
    if: |
      always() && needs.build.result == 'success' &&
      (github.ref_name != 'develop' || needs.check-business-hours.outputs.allowed == 'true')
    uses: ./.github/workflows/deploy.yml
    concurrency: ${{ github.ref }}-deploy-cceg
    with:
      brand: cceg
      prod_domain: ${{ vars.PROD_DOMAIN_CCEG }}
      nonprod_domain: ${{ vars.NONPROD_DOMAIN_CCEG }}
    secrets:
      workload-identity-provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
      project_id: ${{ secrets.PROJECT_ID }}
      pgpassword: ${{ secrets.PGPASSWORD_CCEG }}
